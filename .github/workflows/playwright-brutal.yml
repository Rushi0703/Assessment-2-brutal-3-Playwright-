name: Playwright Brutal 3 Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: playwright-brutal-3

    strategy:
      fail-fast: false

      matrix:
        project:
          - dummyjson-project
          - data-project
          - chain-project

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: playwright-brutal-3/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test --project=${{ matrix.project }}
        env:
          CI: true
          BASE_URL: https://dummyjson.com

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.project }}-${{ github.run_number }}
          path: playwright-brutal-3/playwright-report/
          retention-days: 14